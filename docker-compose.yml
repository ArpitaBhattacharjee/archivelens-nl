services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
      POSTGRES_DB: archive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive"]
      interval: 3s
      retries: 20

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://archive:archive@db:5432/archive
      UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  watcher:
    build: .
    command: python -m app.watcher
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://archive:archive@db:5432/archive
      UPLOAD_DIR: /data/uploads
      WATCH_DIR: /data/watch
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
