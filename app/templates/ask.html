{% extends "base.html" %}
{% block title %}Ask the Archive · ArchiveLens NL{% endblock %}
{% block content %}
<h1 class="font-serif text-3xl font-semibold">Ask the Archive</h1>
<p class="mt-2 text-ink/70 max-w-2xl">Ask a question in plain English. Answers come only from items in the archive, with numbered sources you can open.</p>

<form hx-post="/ask" hx-target="#answer" hx-indicator="#thinking" class="mt-6 flex flex-col sm:flex-row gap-2">
  <input name="question" required maxlength="500" placeholder="e.g. What happened to the fishing fleet in the 1890s?"
         class="flex-1 rounded-lg border border-ink/20 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-harbour">
  <button class="bg-harbour text-white rounded-lg px-5 py-3 font-medium">Ask</button>
</form>
<p id="thinking" class="htmx-indicator text-sm text-ink/60 mt-3">Searching the archive…</p>
<div id="answer" class="mt-6"></div>
{% endblock %}
