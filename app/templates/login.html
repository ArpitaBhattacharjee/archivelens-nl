{% extends "base.html" %}
{% block title %}Archivist login · ArchiveLens NL{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-xl border border-ink/10 p-6">
  <h1 class="font-serif text-2xl font-semibold">Archivist login</h1>
  <p class="text-sm text-ink/60 mt-1">Only archivists can add, edit or delete items.</p>
  {% if error %}<p class="mt-3 text-sm text-rust">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login" class="mt-4 grid gap-3">
    <input type="password" name="password" required placeholder="Password" class="rounded-lg border border-ink/20 px-3 py-2">
    <button class="bg-harbour text-white rounded-lg px-4 py-2 font-medium">Log in</button>
  </form>
</div>
{% endblock %}
